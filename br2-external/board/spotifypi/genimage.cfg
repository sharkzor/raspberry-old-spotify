image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"bcm2709-rpi-2-b.dtb",
			"bcm2710-rpi-2-b.dtb",
			"zImage"
		}
	}
	size = 32M
}

# Settings partition: mounted read-only, only remounted rw while saving.
image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 16M
}

image sdcard.img {
	hdimage {
		# Align partitions to the SD card erase block size.
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
